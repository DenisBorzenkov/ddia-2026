name: hw-2-stand

# Стенд sem3-hw2: весь стек под нагрузкой на self-hosted раннере. Репозиторий публичный,
# поэтому запуск только пушем в ci/hw-2-stand или вручную, событий pull_request нет.
on:
  push:
    branches: [ci/hw-2-stand]
    paths:
      - hw-2/**
      - .github/workflows/hw-2-stand.yml
  workflow_dispatch:
    inputs:
      experiments:
        description: Эксперименты после проверки стека
        type: choice
        options: [all, none, "1", "2", "3"]
        default: all

permissions:
  contents: read

# стенд один: следующий прогон ждёт, текущий не прерывается
concurrency:
  group: hw-2-stand
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: hw-2

env:
  COMPOSE_PROJECT_NAME: hw2
  EXPERIMENTS: ${{ inputs.experiments || 'all' }}
  LOAD_SECONDS: 60

jobs:
  stand:
    runs-on: [self-hosted, sem3-hw2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: env
        run: |
          cp .env.example .env
          # в git лежат результаты прошлых прогонов, в артефакт идут только свежие
          rm -rf experiments/results
          mkdir -p experiments/results/logs

      - name: clean previous run
        run: docker compose down -v --remove-orphans

      - name: compose up
        run: docker compose up -d --build

      - name: healthy
        run: |
          n=$(docker compose config --services | wc -l)
          # kafka-init завершился с кодом 0, остальные запущены, healthcheck - healthy
          ready() {
            docker compose ps -a --format json | jq -se --argjson n "$n" '
              flatten | length == $n and all(.[];
                if .Service == "kafka-init" then .State == "exited" and .ExitCode == 0
                else .State == "running" and (.Health == "" or .Health == "healthy") end)' >/dev/null
          }
          for i in $(seq 60); do
            ready && break
            [ "$i" = 60 ] && { docker compose ps -a; exit 1; }
            sleep 5
          done
          docker compose ps -a

      - name: load
        run: |
          sql() { docker compose exec -T postgres psql -U events -d events -tAc "$1"; }
          for i in $(seq 36); do
            # таблицу создаёт консьюмер при старте, до этого запрос падает
            producers=$(sql 'SELECT count(DISTINCT producer_id) FROM events' 2>/dev/null || echo 0)
            consumers=$(sql 'SELECT count(DISTINCT consumer_id) FROM events' 2>/dev/null || echo 0)
            echo "producers=$producers consumers=$consumers"
            [ "$producers" = 3 ] && [ "$consumers" = 3 ] && break
            [ "$i" = 36 ] && exit 1
            sleep 5
          done
          sleep "$LOAD_SECONDS"
          sql 'SELECT consumer_id, count(*) FROM events GROUP BY 1 ORDER BY 1'

      - name: verify
        id: verify
        run: |
          docker compose stop producer-1 producer-2 producer-3
          docker compose run --rm -T verify verify -wait=3m </dev/null | tee experiments/results/0-smoke.txt

      - name: smoke logs
        if: always()
        run: docker compose logs --no-color -t >experiments/results/logs/0-smoke.log

      # каждый эксперимент сам поднимает чистый стек; неудача одного не отменяет следующие
      - name: experiment 1 - kill -9 consumer
        if: ${{ !cancelled() && steps.verify.conclusion == 'success' && (env.EXPERIMENTS == 'all' || env.EXPERIMENTS == '1') }}
        timeout-minutes: 15
        run: |
          rc=0
          ./experiments/1-kill-consumer.sh || rc=$?
          docker compose logs --no-color -t >experiments/results/logs/1.log
          exit "$rc"

      - name: experiment 2 - brokers down
        if: ${{ !cancelled() && steps.verify.conclusion == 'success' && (env.EXPERIMENTS == 'all' || env.EXPERIMENTS == '2') }}
        timeout-minutes: 25
        run: |
          rc=0
          ./experiments/2-brokers-down.sh || rc=$?
          docker compose logs --no-color -t >experiments/results/logs/2.log
          exit "$rc"

      - name: experiment 3 - KEY_MODE none vs user_id
        if: ${{ !cancelled() && steps.verify.conclusion == 'success' && (env.EXPERIMENTS == 'all' || env.EXPERIMENTS == '3') }}
        timeout-minutes: 25
        run: |
          rc=0
          ./experiments/3-key-mode.sh || rc=$?
          docker compose logs --no-color -t >experiments/results/logs/3.log
          exit "$rc"

      - name: results
        if: ${{ !cancelled() && steps.verify.conclusion == 'success' }}
        run: |
          r=experiments/results
          fail=0
          err() { echo "::error::$*"; fail=1; }
          note() { echo "$*"; echo "* $*" >>"$GITHUB_STEP_SUMMARY"; }
          want() { [ "$EXPERIMENTS" = all ] || [ "$EXPERIMENTS" = "$1" ]; }
          # значение строки отчёта verify по подписи и первое число из него
          row() { sed -n "s/^$2  *//p" "$1" 2>/dev/null || true; }
          num() { row "$1" "$2" | cut -d' ' -f1; }

          runs=(0-smoke)
          if want 1; then runs+=(1); fi
          if want 2; then runs+=(2); fi
          if want 3; then runs+=(3-user_id 3-none); fi

          {
            echo '| verify | в sink | в DLT (уник.) | lag | потеряно (польз.) | дублей | нарушений порядка (польз.) | итог |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            for f in "${runs[@]}"; do
              v=$r/$f.txt
              echo "| $f | $(row "$v" 'событий в sink') | $(row "$v" 'записей в events.dlt (уникальных)') | $(row "$v" 'lag группы') | $(row "$v" 'потеряно seq (пользователей)') | $(row "$v" 'отброшено дублей по event_id') | $(row "$v" 'нарушений порядка (пользователей)') | $(tail -1 "$v" 2>/dev/null) |"
            done
            echo
          } >>"$GITHUB_STEP_SUMMARY"

          for f in "${runs[@]}"; do
            v=$r/$f.txt
            [ -s "$v" ] || { err "$f: нет вывода verify"; continue; }
            head -1 "$v" | grep -q '^DenisBorzenkov ' || err "$f: первая строка - не логин и время"
            grep -q '^OK: потерь нет' "$v" || err "$f: $(tail -1 "$v")"
            [ "$(row "$v" 'lag группы')" = 0 ] || err "$f: lag группы $(row "$v" 'lag группы')"
          done

          if want 1; then
            dups=$(num "$r/1.txt" 'отброшено дублей по event_id')
            owners=$(awk '$1 == "events-processor" { printf "p%s %s ", $3, $NF }' "$r/1-groups-after.txt" 2>/dev/null || true)
            note "эксп. 1: дублей ${dups:-н/д}; партиции через 90 с после kill: ${owners:-н/д}"
            [ "${dups:-0}" -gt 0 ] || err "эксп. 1: нет отброшенных дублей после kill -9"
            # все три партиции у живых консьюмеров
            awk '$1 == "events-processor" { n++; if ($NF == "consumer-2" || $NF == "-") bad++ }
                 END { exit !(n == 3 && !bad) }' "$r/1-groups-after.txt" ||
              err "эксп. 1: партиции consumer-2 не переназначены"
          fi

          if want 2; then
            t() { sed -n "s/^$1=//p" "$r/2-times.env" 2>/dev/null || true; }
            from=$(t min_isr_3) to=$(t min_isr_2)
            # NOT_ENOUGH_REPLICAS между отметками min_isr_3 и min_isr_2 (мс)
            ner=$(jq -nR --argjson from "${from:-0}" --argjson to "${to:-0}" '
              [inputs | fromjson? | select(.code? == "NOT_ENOUGH_REPLICAS")
               | .time | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601 * 1000
               | select(. >= $from and . <= $to)] | length' "$r/2-producers.log" || true)
            codes=$(jq -nrR '[inputs | fromjson? | .code? // empty] | group_by(.)
              | map("\(.[0]) \(length)") | join(", ")' "$r/2-producers.log" || true)
            note "эксп. 2: NOT_ENOUGH_REPLICAS в фазе min.insync.replicas=3 - ${ner:-н/д}; отклонённые батчи за прогон: ${codes:-нет}"
            [ "${ner:-0}" -gt 0 ] || err "эксп. 2: нет NOT_ENOUGH_REPLICAS в фазе min.insync.replicas=3"
          fi

          if want 3; then
            u=$(num "$r/3-user_id.txt" 'нарушений порядка (пользователей)')
            n=$(num "$r/3-none.txt" 'нарушений порядка (пользователей)')
            note "эксп. 3: нарушений порядка user_id ${u:-н/д}, none ${n:-н/д}"
            [ "$u" = 0 ] || err "эксп. 3: KEY_MODE=user_id дал нарушения порядка"
            [ "${n:-0}" -gt 0 ] || err "эксп. 3: KEY_MODE=none без нарушений порядка"
          fi
          exit "$fail"

      - name: logs
        if: failure() || cancelled()
        run: docker compose logs --no-color -t >experiments/results/logs/last.log

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hw-2-stand-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw-2/experiments/results/

      - name: compose down
        if: always()
        run: docker compose down -v --remove-orphans
