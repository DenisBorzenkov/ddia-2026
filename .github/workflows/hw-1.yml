name: hw-1

on:
  pull_request:
    paths:
      - hw-1/**
      - .github/workflows/hw-1.yml
  push:
    branches: [main, ddia-hw-1]
    paths:
      - hw-1/**
      - .github/workflows/hw-1.yml

permissions:
  contents: read

concurrency:
  group: hw-1-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hw-1

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hw-1/go.mod
          cache-dependency-path: hw-1/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: hw-1

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: hw-1/Dockerfile
      - name: compose config
        run: docker compose config -q
      - name: compose up
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: smoke
        run: |
          for port in 8081 8082; do
            curl -sSf "localhost:$port/health"
            curl -sSf -X POST "localhost:$port/items" -d '{"name":"smoke"}'
            test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:$port/items/999")" = 404
          done
      - name: logs
        if: failure()
        run: docker compose logs
      - name: compose down
        if: always()
        run: docker compose down -v

  actionlint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
